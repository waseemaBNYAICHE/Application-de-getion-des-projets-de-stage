services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stagiaire-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: stagiaire-nginx
    ports:
      - "8001:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stagiaire-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5174:5173"

  postgres:
    image: postgres:17-alpine
    container_name: stagiaire-postgres
    environment:
      POSTGRES_DB: stagiaire
      POSTGRES_USER: stagiaire
      POSTGRES_PASSWORD: stagiaire
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagiaire -d stagiaire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  frontend-node-modules: